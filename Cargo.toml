[package]
name = "krypton-consumer"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "CLI demo that streams OsRng entropy stats and sentry decisions via krypton-entropy-core."
license = "MIT"
repository = "https://github.com/hellocripsis/krypton-consumer"

[dependencies]
krypton-entropy-core = { git = "https://github.com/hellocripsis/krypton-entropy-core.git", tag = "v0.1.0" }
rand = "0.8.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
